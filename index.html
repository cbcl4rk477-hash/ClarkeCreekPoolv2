<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#080e0a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>🎱 Clarke Creek Pool</title>
<style>
/* ============================================================
   Clarke Creek Pool — Main Stylesheet v2
   Dark sports-app aesthetic. Mobile-first.
   ============================================================ */

/* ── FONTS ─────────────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap');

/* ── DESIGN TOKENS ─────────────────────────────────────────── */
:root {
  --gold:        #c9a84c;
  --gold-light:  #e8c96a;
  --gold-glow:   rgba(201,168,76,0.15);
  --green:       #1e4d34;
  --green-bright:#27ae60;
  --red:         #e74c3c;
  --amber:       #f39c12;

  --bg:          #080e0a;
  --bg-card:     rgba(255,255,255,0.04);
  --bg-card-2:   rgba(255,255,255,0.07);
  --bg-input:    rgba(255,255,255,0.08);

  --border:      rgba(255,255,255,0.08);
  --border-gold: rgba(201,168,76,0.25);

  --text:        #f2ead8;
  --text-muted:  rgba(242,234,216,0.4);
  --text-dim:    rgba(242,234,216,0.15);

  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-xl:   22px;

  --shadow-card: 0 2px 16px rgba(0,0,0,0.4);
  --shadow-gold: 0 0 24px rgba(201,168,76,0.2);

  --font-display: 'Barlow Condensed', sans-serif;
  --font-body:    'Barlow', sans-serif;

  --nav-height:  64px;
  --topbar-height: 56px;
}

/* ── RESET ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 15% 0%,   rgba(30,77,52,0.35) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(201,168,76,0.08) 0%, transparent 50%),
    repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,255,255,0.005) 40px, rgba(255,255,255,0.005) 41px);
  pointer-events: none;
  z-index: 0;
}

/* ── LAYOUT ─────────────────────────────────────────────────── */
#app { position: relative; z-index: 1; }

.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-height);
  background: rgba(8,14,10,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}
.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px;
  height: 100%;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-balls { font-size: 20px; }
.brand-name {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-pot {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  color: var(--gold);
  background: var(--gold-glow);
  border: 1px solid var(--border-gold);
  padding: 3px 10px;
  border-radius: 20px;
}
.topbar-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  opacity: 0.7;
  transition: opacity 0.15s;
}
.topbar-btn:hover { opacity: 1; }

.main-content {
  padding-top: calc(var(--topbar-height) + 12px);
  padding-bottom: calc(var(--nav-height) + 16px);
  max-width: 680px;
  margin: 0 auto;
  padding-left: 12px;
  padding-right: 12px;
}

/* ── BOTTOM NAV ─────────────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: rgba(8,14,10,0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  transition: color 0.15s;
  padding: 8px 4px;
}
.nav-btn--active { color: var(--gold); }
.nav-icon { font-size: 18px; line-height: 1; }
.nav-label { font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
.nav-btn--active .nav-label { color: var(--gold); }

/* ── CARDS ──────────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}
.card-accent {
  background: rgba(201,168,76,0.04);
  border-color: var(--border-gold);
}
.card-title {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* ── HERO STATS ─────────────────────────────────────────────── */
.hero-stats {
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: linear-gradient(135deg, rgba(30,77,52,0.4), rgba(201,168,76,0.08));
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-xl);
  padding: 20px 16px;
  margin-bottom: 12px;
}
.hero-stat { text-align: center; }
.hero-stat-val {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
}
.hero-stat-lbl {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.hero-divider {
  width: 1px;
  height: 40px;
  background: var(--border);
}

/* ── STATS GRID ─────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 8px;
  text-align: center;
}
.stat-box--accent {
  background: var(--gold-glow);
  border-color: var(--border-gold);
}
.stat-val {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;
  color: var(--gold);
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  letter-spacing: 0.5px;
}

/* ── PROGRESS CARD ──────────────────────────────────────────── */
.progress-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.progress-pct {
  font-weight: 700;
  color: var(--gold);
}
.prog-wrap {
  height: 6px;
  background: rgba(255,255,255,0.07);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--gold));
  border-radius: 3px;
  transition: width 0.6s ease;
}
.prog-lg { height: 10px; border-radius: 5px; }

/* ── SEARCH ─────────────────────────────────────────────────── */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  margin-bottom: 12px;
}
.search-icon { font-size: 14px; opacity: 0.5; }
.search-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
}
.search-input::placeholder { color: var(--text-muted); }

/* ── STANDINGS TABLE ────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
.standings-table {
  width: 100%;
  border-collapse: collapse;
}
.standings-table th {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  padding: 8px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  font-weight: 600;
  text-transform: uppercase;
}
.standings-table td {
  padding: 10px 8px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.standings-table th.left,
.standings-table td.left { text-align: left; }
.standings-table th,
.standings-table td { text-align: center; }
.standing-row { cursor: pointer; transition: background 0.1s; }
.standing-row:hover { background: var(--bg-card-2); }
.row-top-1 { background: rgba(201,168,76,0.08); }
.row-top-2 { background: rgba(192,192,192,0.05); }
.row-top-3 { background: rgba(39,174,96,0.05); }
.rank-num {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
}
.player-row-inner {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
}
.player-name-main { font-weight: 600; font-size: 13px; }
.player-meta { font-size: 10px; color: var(--text-muted); }
.num-cell { font-size: 13px; font-weight: 600; }
.win-cell  { color: var(--green-bright); }
.draw-cell { color: var(--amber); }
.loss-cell { color: var(--red); }
.pts-cell { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--gold); }
.pct-cell { font-size: 12px; color: var(--text-muted); }
.streak-cell { display: flex; gap: 2px; justify-content: center; }
.pts-big { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--gold); }
.empty-row { text-align: center; padding: 24px; color: var(--text-muted); font-style: italic; }

/* ── STREAK BADGES ──────────────────────────────────────────── */
.streak-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 800;
}
.badge-win  { background: rgba(39,174,96,0.2);  color: var(--green-bright); }
.badge-loss { background: rgba(231,76,60,0.2);  color: var(--red); }
.badge-draw { background: rgba(243,156,18,0.2); color: var(--amber); }

/* ── AVATAR ─────────────────────────────────────────────────── */
.av {
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  letter-spacing: 0;
}

/* ── GROUP BUTTONS ──────────────────────────────────────────── */
.group-btns {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.group-btn {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-card);
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.group-btn.active {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border-color: transparent;
  color: #0c1810;
}
.group-count  { display: block; font-size: 10px; font-weight: 400; margin-top: 2px; }
.group-progress { display: block; font-size: 11px; font-weight: 700; }

/* ── VIEW TOGGLE ────────────────────────────────────────────── */
.view-toggle {
  display: flex;
  gap: 3px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 3px;
  margin-bottom: 12px;
}
.view-btn {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.view-btn.active {
  background: var(--green);
  color: var(--gold);
}

/* ── FILTERS ────────────────────────────────────────────────── */
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-select, .result-select, .date-input, .pts-input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
}
.filter-select option, .result-select option { background: #0c1810; }
.toggle-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
}

/* ── FIXTURE CARDS ──────────────────────────────────────────── */
.fixture-day { margin-bottom: 20px; }
.fixture-day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(201,168,76,0.15);
  padding-bottom: 7px;
  margin-bottom: 8px;
}
.fixture-date {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
}
.fixture-day-count { font-size: 11px; color: var(--text-muted); }
.onsite-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.onsite-chip {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
.chip-on  { background: rgba(39,174,96,0.12);  color: var(--green-bright); border: 1px solid rgba(39,174,96,0.2); }
.chip-off { background: rgba(231,76,60,0.08);  color: var(--red);          border: 1px solid rgba(231,76,60,0.15); }

.fixture-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 6px;
  flex-wrap: wrap;
  transition: border-color 0.2s;
}
.fixture-done { border-color: rgba(39,174,96,0.2); }
.fixture-players {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 200px;
}
.fixture-name { font-size: 13px; font-weight: 600; }
.fixture-vs   { font-size: 10px; color: var(--text-muted); padding: 0 2px; }
.fixture-controls { display: flex; align-items: center; gap: 6px; }
.result-badge { font-size: 12px; color: var(--green-bright); }
.badge-done    { color: var(--green-bright); }
.badge-pending { color: var(--text-dim); }

/* ── KNOCKOUT ───────────────────────────────────────────────── */
.bracket-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 520px) {
  .bracket-grid { grid-template-columns: 1fr; }
}
.bracket-col-title {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.ko-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 8px;
  transition: border-color 0.2s;
}
.ko-final {
  background: rgba(201,168,76,0.06);
  border-color: var(--border-gold);
}
.ko-done { border-color: rgba(39,174,96,0.2); }
.ko-round-label {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.ko-final .ko-round-label { color: var(--gold); }
.ko-desc { font-size: 10px; color: var(--text-muted); margin-bottom: 10px; }
.ko-matchup {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.ko-player {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  flex: 1;
}
.ko-winner { opacity: 1; }
.ko-loser  { opacity: 0.4; }
.ko-vs { font-size: 10px; color: var(--text-muted); }
.ko-tbd { font-size: 12px; color: var(--text-muted); font-style: italic; }
.ko-win-badge {
  font-size: 9px;
  background: var(--green-bright);
  color: #fff;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 800;
}
.ko-awaiting { font-size: 11px; color: var(--text-muted); font-style: italic; }
.ko-controls { margin-top: 6px; }

/* Champion */
.champion-banner {
  text-align: center;
  padding: 28px 16px;
  background: radial-gradient(ellipse at center, rgba(201,168,76,0.15) 0%, transparent 70%);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-xl);
  margin-bottom: 16px;
  animation: glow-pulse 2s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%,100% { box-shadow: 0 0 20px rgba(201,168,76,0.1); }
  50%      { box-shadow: 0 0 40px rgba(201,168,76,0.25); }
}
.champion-trophy { font-size: 56px; line-height: 1; }
.champion-name {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  color: var(--gold);
  margin-top: 8px;
}
.champion-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }

/* ── QUALIFY ────────────────────────────────────────────────── */
.qualify-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.qualify-group-title { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
.qualify-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--bg-card); border-radius: var(--radius-sm); margin-bottom: 5px; }
.qualify-medal { font-size: 14px; }
.qualify-name  { flex: 1; font-size: 12px; font-weight: 500; }
.qualify-pts   { font-family: var(--font-display); font-size: 14px; font-weight: 800; color: var(--gold); }
.qual-badge    { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(39,174,96,0.12); color: var(--green-bright); border: 1px solid rgba(39,174,96,0.2); }
.no-qual-badge { font-size: 10px; color: var(--text-muted); }

/* ── PRIZE ──────────────────────────────────────────────────── */
.prize-hero {
  text-align: center;
  padding: 32px 16px;
  background: radial-gradient(ellipse at center, rgba(201,168,76,0.1) 0%, transparent 65%);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-xl);
  margin-bottom: 12px;
}
.prize-hero-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
.prize-amount {
  font-family: var(--font-display);
  font-size: 72px;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
  text-shadow: 0 0 40px rgba(201,168,76,0.4);
}
.prize-hero-sub { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
.prize-progress-header, .prize-progress-footer {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.prize-progress-footer { margin-top: 6px; margin-bottom: 0; }
.pct-label { font-weight: 700; color: var(--gold); }
.prize-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  border: 1px solid var(--border);
}
.prize-val { font-family: var(--font-display); font-size: 28px; font-weight: 900; }
.game-grid { display: flex; gap: 4px; flex-wrap: wrap; }
.game-cell {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: flex;
  align-items: center;

// ============================================================
// auth.js — Admin authentication
//
// Uses SHA-256 hashed password comparison (Web Crypto API).
// Admin session stored in sessionStorage — survives page refresh
// but clears automatically when browser/tab is closed.
// ============================================================

const AUTH = {
  SESSION_KEY: "cc_admin_session",

  // Check if current session is valid
  isAdmin() {
    try {
      const raw = sessionStorage.getItem(this.SESSION_KEY);
      if (!raw) return false;
      const session = JSON.parse(raw);
      // Check expiry
      if (Date.now() > session.expires) {
        this.logout();
        return false;
      }
      return session.admin === true;
    } catch(e) { return false; }
  },

  // Hash a string using SHA-256 (returns hex string)
  async hash(str) {
    const buf  = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  },

  // Attempt login — returns true if password correct
  async login(password) {
    const trimmed = password.trim();
    // Direct check first (fastest, works everywhere)
    if (trimmed === "CCWFpool") {
      sessionStorage.setItem(this.SESSION_KEY, JSON.stringify({
        admin:   true,
        expires: Date.now() + CONFIG.ADMIN_SESSION_MS
      }));
      return true;
    }
    // Hash check as backup
    const hashed = await this.hash(trimmed);
    if (hashed !== CONFIG.ADMIN_PASSWORD_HASH) return false;
    sessionStorage.setItem(this.SESSION_KEY, JSON.stringify({
      admin:   true,
      expires: Date.now() + CONFIG.ADMIN_SESSION_MS
    }));
    return true;
  },

  // Log out and clear session
  logout() {
    sessionStorage.removeItem(this.SESSION_KEY);
  }
};

function getWriteClient() {
  if (CONFIG.SUPABASE_SERVICE_KEY) {
    if (!sbAdmin) sbAdmin = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_SERVICE_KEY);
    return sbAdmin;
  }
  return sb; // use anon key — RLS allows writes, app password protects access
}

const DB = {
  async save(state) {
    if (!AUTH.isAdmin()) { console.warn("Save blocked: not admin"); return false; }
    try {
      const { error } = await getWriteClient().from("pool_state").upsert({
        key:          LEGACY_KEY,
        compStart:    state.compStart,
        playerStarts: state.playerStarts,
        ptW:          state.ptW,
        ptD:          state.ptD,
        ptL:          state.ptL,
        players:      PLAYERS,
        groups:       state.groups,
        fixtures:     state.fixtures,
        knockout:     state.knockout,
        updated_at:   new Date().toISOString()
      }, { onConflict: "key" });
      return !error;
    } catch(e) { console.error("DB.save:", e); return false; }
  },

  async load() {
    try {
      const { data, error } = await sb.from("pool_state").select("*").eq("key", LEGACY_KEY).single();
      if (error || !data) return null;
      return data;
    } catch(e) { return null; }
  },

  subscribeToState(cb) {
    return sb.channel("pool_state_changes")
      .on("postgres_changes", { event:"*", schema:"public", table:"pool_state", filter:`key=eq.${LEGACY_KEY}` },
        (payload) => { if (payload.new) cb(payload.new); })
      .subscribe();
  },

  unsubscribe(channel) { if (channel) sb.removeChannel(channel); }
};

    syncing:      false,

  };
}

function makeKnockout() {
  return [
    {id:"sf1",   label:"Semi-Final 1",       desc:"Group A 1st vs Group B 2nd", result:null},
    {id:"sf2",   label:"Semi-Final 2",       desc:"Group B 1st vs Group A 2nd", result:null},
    {id:"sf3",   label:"3rd Place Semi",     desc:"Group A 3rd vs Group B 3rd", result:null},
    {id:"final", label:"🏆 Grand Final",     desc:"SF1 winner vs SF2 winner",   result:null},
    {id:"third", label:"3rd Place Play-off", desc:"SF3 winner vs SF1 loser",    result:null},
  ];
}

let state = makeDefaultState();

// ── HYDRATE FROM DB ─────────────────────────────────────────
// Merge saved data into state without touching UI-only fields
function hydrateState(data) {
  if (!data) return;
  if (data.compStart)                              state.compStart    = data.compStart;
  if (data.playerStarts)                           state.playerStarts = data.playerStarts;
  if (data.ptW !== undefined && data.ptW !== null) state.ptW = data.ptW;
  if (data.ptD !== undefined && data.ptD !== null) state.ptD = data.ptD;
  if (data.ptL !== undefined && data.ptL !== null) state.ptL = data.ptL;
  // Restore custom player list — stored in "players" column or fallback to DEFAULT_PLAYERS
  if (data.players && Array.isArray(data.players) && data.players.length >= 1) {
    PLAYERS = data.players;
    state.players = data.players;
  }
  if (data.groups)                                 state.groups = data.groups;
  if (data.fixtures?.length) {
    state.fixtures = data.fixtures;
    if (state.tab === "leaderboard" || state.tab === "setup") state.tab = "leaderboard";
  }
  if (data.knockout?.length) state.knockout = data.knockout;
}

// ── STANDINGS CALCULATION ────────────────────────────────────
function calcStandings(playerList, groupLabel) {
  const stats = playerList.map(p => ({p, pl:0, w:0, d:0, l:0, pts:0, streak:[]}));
  const gFix  = state.fixtures.filter(f => f.group === groupLabel);

  for (const f of gFix) {
    if (!f.result) continue;
    const s1 = stats.find(s => s.p.id === f.p1);
    const s2 = stats.find(s => s.p.id === f.p2);
    if (!s1 || !s2) continue;
    s1.pl++; s2.pl++;
    if (f.result === "p1") {
      s1.w++; s1.pts += state.ptW; s1.streak.push("W");
      s2.l++; s2.pts += state.ptL; s2.streak.push("L");
    } else if (f.result === "p2") {
      s2.w++; s2.pts += state.ptW; s2.streak.push("W");
      s1.l++; s1.pts += state.ptL; s1.streak.push("L");
    } else {
      s1.d++; s1.pts += state.ptD; s1.streak.push("D");
      s2.d++; s2.pts += state.ptD; s2.streak.push("D");
    }
  }
  return stats.sort((a,b) => b.pts - a.pts || b.w - a.w || a.l - b.l);
}

// ── PLAYER STATS (all-time across both groups) ───────────────
function calcPlayerStats(pid) {
  const played = state.fixtures.filter(f => (f.p1===pid||f.p2===pid) && f.result);
  let w=0, d=0, l=0;
  for (const f of played) {
    const won = (f.result==="p1"&&f.p1===pid)||(f.result==="p2"&&f.p2===pid);
    const drew = f.result==="draw";
    if (won) w++; else if (drew) d++; else l++;
  }
  const total = w+d+l;
  return { played: total, w, d, l,
    winPct: total ? Math.round(w/total*100) : 0,
    pts: w*state.ptW + d*state.ptD + l*state.ptL
  };
}

// ── HELPERS ─────────────────────────────────────────────────
function getPlayer(pid)   { return PLAYERS.find(p => p.id === pid); }
function pName(pid)       { return getPlayer(pid)?.name || "?"; }
function pFirst(pid)      { return pName(pid).split(" ")[0]; }
function pColor(pid)      { return getPlayer(pid)?.color || "#888"; }
function ds(date)         { return date.toISOString().split("T")[0]; }
function pd(s)            { return new Date(s + "T00:00:00"); }
const MS_DAY = 86400000;

// ── ROSTER LOGIC ────────────────────────────────────────────
function cycleLenDays(roster) {
  if (roster==="1on1off_wed"||roster==="1on1off_mon") return 14;
  if (roster==="2on2off") return 28;
  if (roster==="2on1off") return 21;
  return 14;
}
function onDaysInCycle(roster) {
  if (roster==="1on1off_wed"||roster==="1on1off_mon") return 7;
  if (roster==="2on2off") return 14;
  if (roster==="2on1off") return 14;
  return 7;
}
function isOnSite(player, date) {
  const startStr = state.playerStarts[player.id];
  if (startStr) {
    const start = new Date(startStr + "T00:00:00");
    if (date < start) return false;
    const daysSince = Math.floor((date - start) / MS_DAY);
    return (daysSince % cycleLenDays(player.roster)) < onDaysInCycle(player.roster);
  }
  const ref = new Date("2020-01-01T00:00:00");
  const daysSince = Math.floor((date - ref) / MS_DAY);
  const c = cycleLenDays(player.roster), o = onDaysInCycle(player.roster);
  return ((daysSince % c) + c) % c < o;
}
function weekKey(player, date) {
  const d = new Date(date), day = d.getDay();
  const pivot = player.roster === "1on1off_wed" ? 3 : 1;
  const daysBack = (day + 7 - pivot) % 7;
  const ws = new Date(d.getTime() - daysBack * MS_DAY).toISOString().split("T")[0];
  return player.id + ":" + ws;
}

// ── FIXTURE GENERATION ──────────────────────────────────────
function buildGroupFixtures(groupPlayers, gLabel) {
  if (!state.compStart) return [];
  const start = pd(state.compStart);
  const pairs = [];
  for (let i = 0; i < groupPlayers.length; i++)
    for (let j = i + 1; j < groupPlayers.length; j++)
      pairs.push([groupPlayers[i], groupPlayers[j]]);
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  const MAX_DAYS=700, MAX_PER_DAY=3, GPW=1;
  const dayLoad={}, weekLoad={};
  const fixtures=[];
  let fid = 0;
  for (const [p1, p2] of pairs) {
    let done = false;
    for (let d = 0; d < MAX_DAYS && !done; d++) {
      const date = new Date(start.getTime() + d * MS_DAY);
      const dateStr = ds(date);
      if (!isOnSite(p1, date) || !isOnSite(p2, date)) continue;
      if ((dayLoad[dateStr]||0) >= MAX_PER_DAY) continue;
      const wk1 = weekKey(p1, date), wk2 = weekKey(p2, date);
      if ((weekLoad[wk1]||0) >= GPW || (weekLoad[wk2]||0) >= GPW) continue;
      dayLoad[dateStr]  = (dayLoad[dateStr]||0) + 1;
      weekLoad[wk1]     = (weekLoad[wk1]||0) + 1;
      weekLoad[wk2]     = (weekLoad[wk2]||0) + 1;
      fixtures.push({id:`${gLabel}-${fid++}`, p1:p1.id, p2:p2.id, date:dateStr, result:null, group:gLabel});
      done = true;
    }
    if (!done) {
      for (let d = 0; d < MAX_DAYS; d++) {
        const date = new Date(start.getTime() + d * MS_DAY);
        if (isOnSite(p1, date) && isOnSite(p2, date)) {
          fixtures.push({id:`${gLabel}-${fid++}`, p1:p1.id, p2:p2.id, date:ds(date), result:null, group:gLabel, fallback:true});
          break;
        }
      }
    }
  }
  return fixtures.sort((a,b) => a.date.localeCompare(b.date));
}

function seededShuffle(arr, seed) {
  const a = [...arr]; let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawAndGenerate() {
  if (!confirm("This will draw new groups and generate all fixtures. Any existing results will be lost. Continue?")) return;
  const seed     = Date.now();
  const shuffled = seededShuffle(PLAYERS, seed);
  const half     = Math.ceil(shuffled.length / 2); // splits evenly, A gets extra if odd
  state.groups   = { A: shuffled.slice(0, half), B: shuffled.slice(half) };
  state.fixtures = [
    ...buildGroupFixtures(state.groups.A, "A"),
    ...buildGroupFixtures(state.groups.B, "B")
  ];
  state.knockout = makeKnockout();
  state.tab      = "groups";
  scheduleSave();
  render();
  toast(`Groups drawn: ${state.groups.A.length} in A, ${state.groups.B.length} in B`, "success");
}

function resetSeason() {
  if (!confirm("Reset the entire season? This deletes ALL results, fixtures and group draws. This cannot be undone.")) return;
  state.groups   = null;
  state.fixtures = [];
  state.knockout = makeKnockout();
  state.tab      = "setup";
  scheduleSave();
  render();
  toast("Season reset.", "info");
}

// ── TOAST NOTIFICATIONS ─────────────────────────────────────
let toastTimer = null;

function toast(msg, type = "info", duration = 3000) {
  // type: "success" | "error" | "info" | "warning"
  const container = document.getElementById("toast-container");
  if (!container) return;

  const el = document.createElement("div");
  el.className = `toast toast-${type}`;
  const icons = { success:"✓", error:"✕", info:"ℹ", warning:"⚠" };
  el.innerHTML = `<span class="toast-icon">${icons[type]||"ℹ"}</span><span>${msg}</span>`;
  container.appendChild(el);

  // Animate in
  requestAnimationFrame(() => el.classList.add("toast-show"));

  setTimeout(() => {
    el.classList.remove("toast-show");
    el.classList.add("toast-hide");
    setTimeout(() => el.remove(), 300);
  }, duration);
}

// ── AVATAR ──────────────────────────────────────────────────
function av(pid, size = 28) {
  const p = getPlayer(pid);
  if (!p) return `<span class="av" style="width:${size}px;height:${size}px;background:#333;"></span>`;
  const fs = Math.floor(size * 0.34);
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${fs}px;background:${p.color};" title="${p.name}">${p.short}</span>`;
}

// ── STAT BOX ────────────────────────────────────────────────
function statBox(val, lbl, accent = false) {
  return `<div class="stat-box${accent?" stat-box--accent":""}">
    <div class="stat-val">${val}</div>
    <div class="stat-lbl">${lbl}</div>
  </div>`;
}

// ── STREAK BADGES ───────────────────────────────────────────
function streakBadge(result) {
  const map = { W:"badge-win", L:"badge-loss", D:"badge-draw" };
  return `<span class="streak-badge ${map[result]||""}">${result}</span>`;
}

function recentStreak(streakArr) {
  return streakArr.slice(-5).map(streakBadge).join("");
}

// ── PROGRESS BAR ────────────────────────────────────────────
function progressBar(val, max, label = "") {
  const pct = max ? Math.round(val / max * 100) : 0;
  return `<div class="prog-wrap">
    <div class="prog-fill" style="width:${pct}%"></div>
    ${label ? `<span class="prog-label">${label}</span>` : ""}
  </div>`;
}

// ── FORMAT DATE ─────────────────────────────────────────────
function fmtDate(d) {
  return d.toLocaleDateString("en-AU", {weekday:"short", day:"numeric", month:"short"});
}
function fmtShort(d) {
  return d.toLocaleDateString("en-AU", {day:"numeric", month:"short"});
}

// ── QR CODE ─────────────────────────────────────────────────
function showQR() {
  const url = encodeURIComponent(window.location.href);
  const src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${url}&bgcolor=0c1810&color=c9a84c&margin=10`;

// ── MODAL ───────────────────────────────────────────────────
function showModal(html) {
  const overlay = document.getElementById("modal-overlay");
  const content = document.getElementById("modal-content");
  if (!overlay || !content) return;
  content.innerHTML = html;
  overlay.classList.add("modal-open");
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}

function closeModal() {
  const overlay = document.getElementById("modal-overlay");
  if (overlay) overlay.classList.remove("modal-open");
}

// ── EXPORT / IMPORT ─────────────────────────────────────────
function exportBackup() {
  const data = {
    exportedAt:   new Date().toISOString(),
    appVersion:   "2.0",
    compStart:    state.compStart,
    playerStarts: state.playerStarts,
    ptW:          state.ptW,
    ptD:          state.ptD,
    ptL:          state.ptL,
    groups:       state.groups,
    fixtures:     state.fixtures,
    knockout:     state.knockout
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a    = document.createElement("a");
  a.href     = URL.createObjectURL(blob);
  a.download = `clarke-creek-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast("Backup downloaded!", "success");
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm(`Import backup from ${data.exportedAt?.slice(0,10) || "unknown date"}? This will overwrite current data.`)) return;
      hydrateState(data);
      scheduleSave();
      render();
      toast("Backup imported successfully!", "success");
    } catch(err) {
      toast("Failed to parse backup file.", "error");
    }
  };
  reader.readAsText(file);
}

// ── KNOCKOUT ─────────────────────────────────────────────────
function renderKnockout() {
  if (!state.groups) return `<div class="empty-state">
    <div class="empty-icon">⚔️</div>
    <div class="empty-title">Generate fixtures first</div>
  </div>`;

  const standA = calcStandings(state.groups.A,"A");
  const standB = calcStandings(state.groups.B,"B");
  const A1=standA[0]?.p, A2=standA[1]?.p, A3=standA[2]?.p;
  const B1=standB[0]?.p, B2=standB[1]?.p, B3=standB[2]?.p;
  const seeded = {
    sf1:{p1:A1?.id??null,p2:B2?.id??null},
    sf2:{p1:B1?.id??null,p2:A2?.id??null},
    sf3:{p1:A3?.id??null,p2:B3?.id??null},
  };

  const getResult = id => state.knockout.find(m=>m.id===id)?.result||null;
  const winnerId  = (id,s) => { const r=getResult(id); return r==="p1"?s?.p1:r==="p2"?s?.p2:null; };
  const loserId   = (id,s) => { const r=getResult(id); return r==="p1"?s?.p2:r==="p2"?s?.p1:null; };
  const finalP1=winnerId("sf1",seeded.sf1), finalP2=winnerId("sf2",seeded.sf2);
  const thirdP1=winnerId("sf3",seeded.sf3), thirdP2=loserId("sf1",seeded.sf1);
  const champion=winnerId("final",{p1:finalP1,p2:finalP2});
  const isAdmin = AUTH.isAdmin();

  function koCard(mid,p1id,p2id,label,desc,disabled=false,isFinal=false) {
    const p1=p1id!=null?getPlayer(p1id):null;
    const p2=p2id!=null?getPlayer(p2id):null;
    const r=getResult(mid);
    const controls = isAdmin && !disabled && p1 && p2 ? `
      <div class="ko-controls admin-only">
        <select class="result-select admin-only" onchange="setKOResult('${mid}',this.value)">
          <option value="">— Result —</option>
          <option value="p1" ${r==="p1"?"selected":""}>${p1.name.split(" ")[0]} wins</option>
          <option value="p2" ${r==="p2"?"selected":""}>${p2.name.split(" ")[0]} wins</option>
        </select>
      </div>` : r ? "" : `<div class="ko-awaiting">Awaiting results</div>`;

    return `<div class="ko-card${isFinal?" ko-final":""}${r?" ko-done":""}">
      <div class="ko-round-label">${label}</div>
      <div class="ko-desc">${desc}</div>
      <div class="ko-matchup">
        <div class="ko-player ${r==="p1"?"ko-winner":r?"ko-loser":""}">
          ${p1?`${av(p1.id,28)}<span style="color:${pColor(p1.id)}">${p1.name}</span>`:`<span class="ko-tbd">TBD</span>`}
          ${r==="p1"?`<span class="ko-win-badge">W</span>`:""}
        </div>
        <span class="ko-vs">vs</span>
        <div class="ko-player ${r==="p2"?"ko-winner":r?"ko-loser":""}">
          ${p2?`${av(p2.id,28)}<span style="color:${pColor(p2.id)}">${p2.name}</span>`:`<span class="ko-tbd">TBD</span>`}
          ${r==="p2"?`<span class="ko-win-badge">W</span>`:""}
        </div>
      </div>
      ${controls}
    </div>`;
  }

  const championBanner = champion ? `
    <div class="champion-banner">
      <div class="champion-trophy">🏆</div>
      <div class="champion-name">${pName(champion)}</div>
      <div class="champion-sub">Clarke Creek Pool Champion</div>
    </div>` : "";

  return `
    ${championBanner}
    ${!A1||!B1?`<div class="info-banner">ℹ️ Complete the group stage to seed the knockout bracket.</div>`:""}
    <div class="bracket-grid">
      <div class="bracket-col">
        <div class="bracket-col-title">Semi-Finals</div>
        ${koCard("sf1",seeded.sf1.p1,seeded.sf1.p2,"SF1","Group A 1st vs Group B 2nd")}
        ${koCard("sf2",seeded.sf2.p1,seeded.sf2.p2,"SF2","Group B 1st vs Group A 2nd")}
        ${koCard("sf3",seeded.sf3.p1,seeded.sf3.p2,"3rd Semi","Group A 3rd vs Group B 3rd")}
      </div>
      <div class="bracket-col">
        <div class="bracket-col-title">Finals</div>
        ${koCard("final",finalP1,finalP2,"🏆 Grand Final","SF1 winner vs SF2 winner",!finalP1||!finalP2,true)}
        ${koCard("third",thirdP1,thirdP2,"3rd Place","SF3 winner vs SF1 loser",!thirdP1||!thirdP2)}
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="card-title">Qualified Players</div>
      <div class="qualify-grid">
        ${["A","B"].map(grp => {
          const stand=grp==="A"?standA:standB;
          return `<div>
            <div class="qualify-group-title">Group ${grp}</div>
            ${stand.slice(0,3).map((s,i)=>`
              <div class="qualify-row">
                <span class="qualify-medal">${["🥇","🥈","✅"][i]}</span>
                ${av(s.p.id,22)}<span class="qualify-name">${s.p.name}</span>
                <span class="qualify-pts">${s.pts}pts</span>
              </div>`).join("")}
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

// ── PRIZE ────────────────────────────────────────────────────
function renderPrize() {
  const gPlayed=state.fixtures.filter(f=>f.result).length;
  const koPlayed=state.knockout.filter(m=>m.result).length;
  const total=gPlayed+koPlayed;
  const totalMatch=state.fixtures.length+state.knockout.length;
  const pot=total*CONFIG.PRIZE_PER_GAME;
  const max=totalMatch*CONFIG.PRIZE_PER_GAME;
  const p1=Math.round(pot*0.60), p2=Math.round(pot*0.25), p3=pot-Math.round(pot*0.60)-Math.round(pot*0.25);
  const pct=totalMatch?Math.round(total/totalMatch*100):0;
  const cells=Array.from({length:Math.min(totalMatch,60)},(_,i)=>
    `<div class="game-cell ${i<total?"game-done":"game-todo"}">$${(i+1)*CONFIG.PRIZE_PER_GAME}</div>`).join("");

  return `
    <div class="prize-hero">
      <div class="prize-hero-label">Current Prize Pool</div>
      <div class="prize-amount">$${pot}</div>
      <div class="prize-hero-sub">${total} games × $${CONFIG.PRIZE_PER_GAME}</div>
    </div>
    <div class="stats-grid">
      ${statBox(total,"Games Played",true)}
      ${statBox(totalMatch-total,"Remaining")}
      ${statBox("$"+(totalMatch-total)*CONFIG.PRIZE_PER_GAME,"Still to Add")}
      ${statBox("$"+max,"Max Pot",true)}
    </div>
    <div class="card">
      <div class="card-title">Pool Progress</div>
      <div class="prize-progress-header"><span>$${pot} raised of $${max} possible</span><span class="pct-label">${pct}%</span></div>
      <div class="prog-wrap prog-lg"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prize-progress-footer"><span>Group: ${gPlayed}/${state.fixtures.length}</span><span>Knockout: ${koPlayed}/${state.knockout.length}</span></div>
    </div>
    <div class="card">
      <div class="card-title">Prize Breakdown</div>
      <div class="info-banner" style="margin-bottom:12px;">💰 Updates live as games are played.</div>
      ${[["🥇 1st","60%",p1,"#c9a84c"],["🥈 2nd","25%",p2,"#c0c0c0"],["🥉 3rd","15%",p3,"#cd7f32"]].map(([pos,pct,amt,col])=>`
        <div class="prize-row">
          <div><strong style="color:${col}">${pos}</strong><div style="font-size:11px;color:rgba(242,234,216,0.4)">${pct} of total</div></div>
          <div class="prize-val" style="color:${col}">$${amt}</div>
        </div>`).join("")}
    </div>
    <div class="card"><div class="card-title">Game by Game</div><div class="game-grid">${cells}</div></div>`;
}

// ── PLAYER PROFILE MODAL ─────────────────────────────────────
function showProfile(pid) {
  const p=getPlayer(pid); if(!p)return;
  const stats=calcPlayerStats(pid);
  const history=state.fixtures
    .filter(f=>(f.p1===pid||f.p2===pid)&&f.result)
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);

  const historyRows=history.map(f=>{
    const opp=f.p1===pid?f.p2:f.p1;
    const myRes=f.p1===pid?f.result:f.result==="p1"?"p2":f.result==="p2"?"p1":f.result;
    const label=myRes==="p1"?"Win":myRes==="p2"?"Loss":"Draw";
    const cls=myRes==="p1"?"result-win":myRes==="p2"?"result-loss":"result-draw";
    return `<div class="history-row">
      <span class="history-date">${fmtShort(pd(f.date))}</span>
      <div class="history-opp">${av(opp,20)}<span>${pName(opp)}</span></div>
      <span class="history-result ${cls}">${label}</span>
    </div>`;
  }).join("");

  showModal(`
    <div class="profile-modal">
      <div class="profile-header">
        ${av(pid,64)}
        <div class="profile-info"><h2>${p.name}</h2><div class="profile-roster">${CONFIG.ROSTER_LABELS[p.roster]||p.roster}</div></div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-val">${stats.played}</div><div class="profile-stat-lbl">Played</div></div>
        <div class="profile-stat"><div class="profile-stat-val" style="color:#27ae60">${stats.w}</div><div class="profile-stat-lbl">Wins</div></div>
        <div class="profile-stat"><div class="profile-stat-val" style="color:#e74c3c">${stats.l}</div><div class="profile-stat-lbl">Losses</div></div>
        <div class="profile-stat"><div class="profile-stat-val" style="color:#c9a84c">${stats.winPct}%</div><div class="profile-stat-lbl">Win Rate</div></div>

      <button class="btn btn-felt" style="width:100%;margin-top:12px;" onclick="closeModal()">Close</button>
    </div>`);
}


// ── app.js ──
// Main orchestration: save/load/sync, admin login UI, render loop.

let saveTimer   = null;
let realtimeSub = null;

// ── SAVE ─────────────────────────────────────────────────────
function scheduleSave() {
  if (!AUTH.isAdmin()) return; // never save from viewer
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 700);
}

async function doSave() {
  if (!AUTH.isAdmin()) return;
  state.syncing = true;
  renderSyncIndicator();
  const ok = await DB.save(state);
  state.syncing = false;
  state.saveMsg = ok ? "✓ Saved" : "⚠ Save failed";
  renderSyncIndicator();
  setTimeout(() => { state.saveMsg = ""; renderSyncIndicator(); }, 2500);
  if (!ok) toast("Save failed — check connection", "error");
}

function renderSyncIndicator() {
  const el = document.getElementById("sync-indicator");
  if (!el) return;
  if (!AUTH.isAdmin())       el.innerHTML = `<span class="sync-dot" style="color:var(--text-muted)">●</span> View only`;
  else if (state.syncing)    el.innerHTML = `<span class="sync-dot sync-saving">●</span> Saving…`;
  else if (state.saveMsg)    el.innerHTML = `<span class="sync-dot sync-ok">●</span> ${state.saveMsg}`;
  else if (!state.online)    el.innerHTML = `<span class="sync-dot sync-offline">●</span> Offline`;
  else                       el.innerHTML = `<span class="sync-dot sync-live">●</span> Live`;
}

// ── REALTIME ─────────────────────────────────────────────────
function startRealtime() {
  realtimeSub = DB.subscribeToState((newData) => {
    const age = Date.now() - new Date(newData.updated_at||0).getTime();
    if (age < 2000) return; // ignore own saves
    hydrateState(newData);
    render();
    toast("Scores updated", "info", 2000);
  });
}

// ── RESULT HANDLERS (admin only) ────────────────────────────
function setResult(fid, val) {
  if (!AUTH.isAdmin()) return;
  const f = state.fixtures.find(x => x.id === fid);
  if (f) { f.result = val||null; scheduleSave(); render(); }
}

function setKOResult(mid, val) {
  if (!AUTH.isAdmin()) return;
  const m = state.knockout.find(x => x.id === mid);
  if (m) { m.result = val||null; scheduleSave(); render(); }
}

// ── NAVIGATION ───────────────────────────────────────────────
function navTo(tab) {
  state.tab = tab;
  if (tab !== "leaderboard") state.searchQuery = "";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

// ── ADMIN LOGIN MODAL ────────────────────────────────────────
function showAdminLogin() {
  showModal(`
    <div class="admin-login-modal">
      <div style="font-size:36px;margin-bottom:8px;">🔐</div>
      <h3>Admin Login</h3>
      <p>Enter your admin password to make changes</p>
      <input type="password" id="admin-pw-input" class="admin-pw-input"
        placeholder="Password"
        onkeydown="if(event.key==='Enter')doAdminLogin()">
      <button class="btn btn-gold" style="width:100%" onclick="doAdminLogin()">Login</button>
      <div id="admin-login-error" class="admin-login-error"></div>
      <button class="btn btn-felt" style="width:100%;margin-top:8px;" onclick="closeModal()">Cancel</button>
    </div>`);
  setTimeout(() => document.getElementById("admin-pw-input")?.focus(), 100);
}

async function doAdminLogin() {
  const pw  = document.getElementById("admin-pw-input")?.value || "";
  const err = document.getElementById("admin-login-error");
  if (!pw) { if(err) err.textContent = "Enter your password"; return; }

  const ok = await AUTH.login(pw);
  if (ok) {
    closeModal();
    applyAdminMode();
    render();
    toast("Admin mode active", "success");
  } else {
    if (err) err.textContent = "Incorrect password";
    document.getElementById("admin-pw-input").value = "";
    document.getElementById("admin-pw-input")?.focus();
  }
}

function doAdminLogout() {
  if (!confirm("Log out of admin mode?")) return;
  AUTH.logout();
  applyAdminMode();
  render();
  toast("Logged out", "info");
}

// Apply/remove viewer-mode class on body
function applyAdminMode() {
  if (AUTH.isAdmin()) {
    document.body.classList.remove("viewer-mode");
  } else {
    document.body.classList.add("viewer-mode");
  }
}

// ── MAIN RENDER ──────────────────────────────────────────────
function render() {
  applyAdminMode();

  const isAdmin = AUTH.isAdmin();
  const pot = (state.fixtures.filter(f=>f.result).length +
               state.knockout.filter(m=>m.result).length) * CONFIG.PRIZE_PER_GAME;

  const tabs = [
    {id:"leaderboard", icon:"🏆", label:"Standings"},
    {id:"groups",      icon:"🎱", label:"Groups"},
    {id:"knockout",    icon:"⚔️",  label:"Knockout"},
    {id:"prize",       icon:"💰", label:"Prize"},
    ...(isAdmin ? [{id:"setup", icon:"⚙️", label:"Setup"}] : []),
  ];

  document.getElementById("app").innerHTML = `
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">
          <span class="brand-balls">🎱</span>
          <span class="brand-name">${CONFIG.APP_NAME}</span>
        </div>
        <div class="topbar-actions">
          ${pot>0?`<span class="topbar-pot">$${pot}</span>`:""}
          <button class="topbar-btn" onclick="showQR()" title="Share">📱</button>
          ${!isAdmin
            ? `<button class="topbar-btn" onclick="showAdminLogin()" title="Admin login" style="opacity:0.4;font-size:14px;">🔐</button>`
            : `<button class="topbar-btn btn-logout" onclick="doAdminLogout()" title="Logout" style="font-size:11px;color:var(--red);">Logout</button>`}
          <div id="sync-indicator" class="sync-indicator"></div>
        </div>
      </div>
    </header>

    ${isAdmin ? `
    <div class="admin-bar">
      <div class="admin-bar-label"><span class="admin-badge">ADMIN</span> Edit mode active</div>
      <button class="btn-logout" onclick="doAdminLogout()">Logout</button>
    </div>` : ""}

    <main class="main-content" style="${isAdmin?"padding-top:calc(var(--topbar-height) + 40px + 12px)":""}">
      <div id="page-content">
        ${state.tab==="leaderboard" ? renderLeaderboard()
        : state.tab==="groups"      ? renderGroups()
        : state.tab==="knockout"    ? renderKnockout()
        : state.tab==="prize"       ? renderPrize()
        :                             renderSetup()}
      </div>
      ${!isAdmin?`<div class="viewer-notice">👁 View only · <a href="javascript:showAdminLogin()" style="color:var(--text-muted)">Admin login</a></div>`:""}
    </main>

    <nav class="bottom-nav">
      ${tabs.map(t=>`
        <button class="nav-btn${state.tab===t.id?" nav-btn--active":""}" onclick="navTo('${t.id}')">
          <span class="nav-icon">${t.icon}</span>
          <span class="nav-label">${t.label}</span>
        </button>`).join("")}
    </nav>

    <div id="toast-container" class="toast-container"></div>
    <div id="modal-overlay" class="modal-overlay">
      <div id="modal-content" class="modal-content"></div>
    </div>`;

  renderSyncIndicator();
}

// ── PLAYER MANAGEMENT ────────────────────────────────────────

function showAddPlayer() {
  showModal(`
    <div class="profile-modal">
      <h2 style="font-family:var(--font-display);color:var(--gold);margin-bottom:16px;">Add New Player</h2>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input id="np-name"   class="admin-pw-input" style="letter-spacing:0;text-align:left;" placeholder="Full name e.g. John Smith">
        <input id="np-short"  class="admin-pw-input" style="letter-spacing:0;text-align:left;" placeholder="Short code e.g. JS (2-3 letters)">
        <select id="np-roster" class="filter-select" style="width:100%;padding:12px;">
          ${Object.entries(CONFIG.ROSTER_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}
        </select>
        <input id="np-date" type="date" class="date-input" style="width:100%;padding:12px;" placeholder="First ON date">
        <div id="np-color-row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
          ${AVATAR_COLORS.slice(0,12).map(c=>`<div onclick="selectNewColor('${c}')" style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:2px solid transparent;" id="color-${c.replace('#','')}"></div>`).join("")}
        </div>
        <input id="np-color-val" type="hidden" value="${nextColor()}">
      </div>
      <div style="margin-top:6px;">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Add to current season:</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${state.groups ? `
            <button class="btn btn-gold" onclick="addPlayer('A')">Add to Group A</button>
            <button class="btn btn-gold" onclick="addPlayer('B')">Add to Group B</button>` : ""}
          <button class="btn btn-felt" onclick="addPlayer(null)">Save for Next Season</button>
        </div>
      </div>
      <button class="btn btn-felt" style="width:100%;margin-top:10px;" onclick="closeModal()">Cancel</button>
    </div>`);
  // Pre-select the next available color
  setTimeout(() => {
    const c = nextColor();
    const el = document.getElementById("color-" + c.replace('#',''));
    if (el) el.style.border = "2px solid white";
  }, 50);
}

function selectNewColor(color) {
  document.getElementById("np-color-val").value = color;
  document.querySelectorAll("#np-color-row div").forEach(d => d.style.border = "2px solid transparent");
  const el = document.getElementById("color-" + color.replace('#',''));
  if (el) el.style.border = "2px solid white";
}

function addPlayer(groupLabel) {
  const name  = document.getElementById("np-name")?.value.trim();
  const short = document.getElementById("np-short")?.value.trim().toUpperCase();
  const roster= document.getElementById("np-roster")?.value;
  const date  = document.getElementById("np-date")?.value;
  const color = document.getElementById("np-color-val")?.value || nextColor();

  if (!name || !short) { toast("Name and short code are required","error"); return; }
  if (short.length > 3) { toast("Short code must be 2-3 letters","error"); return; }

  const newPlayer = { id: makePlayerId(), name, short, roster, color };
  PLAYERS.push(newPlayer);
  state.players = PLAYERS;

  // Set start date if provided
  if (date) state.playerStarts[newPlayer.id] = date;

  // Add to group and generate their fixtures mid-season
  if (groupLabel && state.groups) {
    state.groups[groupLabel].push(newPlayer);
    const newFix = buildGroupFixtures([newPlayer], groupLabel)
      .map(f => ({...f, id:`${groupLabel}-new-${Date.now()}-${Math.random().toString(36).slice(2)}`}));
    // Generate fixtures vs all existing group members
    const existingGroupPlayers = state.groups[groupLabel].filter(p => p.id !== newPlayer.id);
    let fid = state.fixtures.length;
    for (const opp of existingGroupPlayers) {
      const start = pd(state.compStart);
      for (let d = 0; d < 700; d++) {
        const date = new Date(start.getTime() + d * MS_DAY);
        if (isOnSite(newPlayer, date) && isOnSite(opp, date)) {
          state.fixtures.push({
            id: `${groupLabel}-add-${fid++}`,
            p1: newPlayer.id, p2: opp.id,
            date: ds(date), result: null, group: groupLabel
          });
          break;
        }
      }
    }
    toast(`${name} added to Group ${groupLabel} with fixtures generated!`, "success");
  } else {
    toast(`${name} saved — will join next season`, "success");
  }

  scheduleSave();
  closeModal();
  render();
}

function showEditPlayer(pid) {
  const p = getPlayer(pid);
  if (!p) return;
  showModal(`
    <div class="profile-modal">
      <h2 style="font-family:var(--font-display);color:var(--gold);margin-bottom:16px;">Edit Player</h2>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input id="ep-name"  class="admin-pw-input" style="letter-spacing:0;text-align:left;" value="${p.name}" placeholder="Full name">
        <input id="ep-short" class="admin-pw-input" style="letter-spacing:0;text-align:left;" value="${p.short}" placeholder="Short code">
        <select id="ep-roster" class="filter-select" style="width:100%;padding:12px;">
          ${Object.entries(CONFIG.ROSTER_LABELS).map(([v,l])=>`<option value="${v}" ${p.roster===v?"selected":""}>${l}</option>`).join("")}
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-gold" style="flex:1;" onclick="saveEditPlayer('${pid}')">Save</button>
        <button class="btn btn-felt" style="flex:1;" onclick="closeModal()">Cancel</button>
      </div>
    </div>`);
}

function saveEditPlayer(pid) {
  const p = getPlayer(pid);
  if (!p) return;
  const name   = document.getElementById("ep-name")?.value.trim();
  const short  = document.getElementById("ep-short")?.value.trim().toUpperCase();
  const roster = document.getElementById("ep-roster")?.value;
  if (!name || !short) { toast("Name and short code required","error"); return; }
  p.name = name; p.short = short; p.roster = roster;
  // Update in groups too if present
  if (state.groups) {
    for (const g of ["A","B"]) {
      const idx = state.groups[g]?.findIndex(x => x.id === pid);
      if (idx >= 0) state.groups[g][idx] = {...state.groups[g][idx], name, short, roster};
    }
  }
  state.players = PLAYERS;
  scheduleSave();
  closeModal();
  render();
  toast(`${name} updated`, "success");
}

function removePlayer(pid) {
  const p = getPlayer(pid);
  if (!p) return;
  if (!confirm(`Remove ${p.name} from the player list? Their existing results will be kept.`)) return;
  PLAYERS = PLAYERS.filter(x => x.id !== pid);
  state.players = PLAYERS;
  // Remove from groups if present
  if (state.groups) {
    for (const g of ["A","B"]) {
      state.groups[g] = state.groups[g]?.filter(x => x.id !== pid) || [];
    }
  }
  scheduleSave();
  render();
  toast(`${p.name} removed`, "info");
}

// ── BOOT ─────────────────────────────────────────────────────
async function boot() {
  // Apply viewer/admin mode immediately
  applyAdminMode();
  render();

  try {
    const data = await Promise.race([
      DB.load(),
      new Promise((_,reject) => setTimeout(()=>reject(new Error("timeout")), 6000))
    ]);
    if (data) { hydrateState(data); render(); }
  } catch(e) {
    toast("Could not reach server — working offline", "warning");
  }

  startRealtime();
}

boot();

</script>
